apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: regression-worker-scaler
  labels:
    app: regression-worker
spec:
  scaleTargetRef:
    name: regression-worker  
  minReplicaCount: 0
  maxReplicaCount: 5
  # pollingInterval isn't mentioned in
  # your notes; KEDA's own default is 30s -- 15s here is just a guess at
  # "probably fine for a demo project," not a measured value.
  cooldownPeriod: 30
  pollingInterval: 15
  triggers:
    - type: metrics-api
      metadata:
        url: "http://inference-svc.default.svc.cluster.local:8080/api/v1/queues/classification/depth"
        valueLocation: "data.depth"
        method: "GET"
        targetValue: "1"
