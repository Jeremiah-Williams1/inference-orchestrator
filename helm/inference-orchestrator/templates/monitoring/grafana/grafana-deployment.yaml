apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: "{{ .Values.monitoring.grafana.image.repository }}:{{ .Values.monitoring.grafana.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.monitoring.grafana.service.port }}
          volumeMounts:
            - name: datasources-vol
              mountPath: /etc/grafana/provisioning/datasources
            - name: provisioning-dashboards-vol
              mountPath: /etc/grafana/provisioning/dashboards
            - name: storage-dashboards-vol
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: datasources-vol
          configMap:
            name: grafana-datasources-config
        - name: provisioning-dashboards-vol
          configMap:
            name: grafana-dashboards-config
        - name: storage-dashboards-vol
          configMap:
            name: grafana-dashboards-config