apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  labels:
    app: loki
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      containers:
        - name: loki
          image: "{{ .Values.monitoring.loki.image.repository }}:{{ .Values.monitoring.loki.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args:
            - "-config.file=/etc/loki/loki-config.yaml"
          ports:
            - containerPort: {{ .Values.monitoring.loki.service.port }}
          volumeMounts:
            - name: loki-config-vol
              mountPath: /etc/loki
            - name: loki-volume
              mountPath: /loki
      volumes:
        - name: loki-config-vol
          configMap:
            name: loki-config
            items:
              - key: loki-config.yaml
                path: loki-config.yaml
        - name: loki-volume
          persistentVolumeClaim:
            claimName: loki-pvc